# 校验 → 构建（含泄漏检查）→ 部署公开 / 私有两个 Worker → 线上冒烟测试。
# 部署的是 verify 任务验证过的同一份 dist/（artifact），不重新构建。
# 手机检查（截图）只在本地 rh check / rh publish 时运行（规格 §6.2），CI 用 --no-shot。
# Daily workflow 用 workflow_call 调用它，并显式传入刚推上去的提交 SHA：用 GITHUB_TOKEN 的推送不会触发 push，
# 而被调用时 github.sha 是调用方的提交（WHI-1937，ADR 0004 §11）。下面统一用 SHA = inputs.sha || github.sha。
# 冒烟测试（含公开站点的 /build.json）通过后才返回 deployed_sha（WHI-1972）。
name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      sha:
        description: 要校验并部署的提交（Daily commit job 刚推上去的那个）
        type: string
        required: true
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
    outputs:
      deployed_sha:
        description: 部署并通过冒烟测试的提交（Daily 的 Lark 推送用，WHI-1972）；没有部署（DEPLOY_ENABLED 不是 true）时为空
        value: ${{ jobs.deploy.outputs.deployed_sha }}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SHA: ${{ inputs.sha || github.sha }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Unit + e2e tests
        run: pnpm test
      - name: rh check (schema / tags / ledger / completeness; no screenshots)
        run: node cli/rh.ts check --no-shot
      - name: rh daily check (Daily Topics schema / references / state; offline, no link probing)
        run: node cli/rh.ts daily check
      - name: rh build (public / private split + leak check)
        run: node cli/rh.ts build
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ inputs.sha || github.sha }}
          path: dist/
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://research-hub.demiwhisker.workers.dev
    outputs:
      deployed_sha: ${{ steps.deployed.outputs.sha }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check credentials and the commit being deployed
        run: |
          [ "$(git rev-parse HEAD)" = "$SHA" ] || { echo "::error::checked out $(git rev-parse HEAD), expected $SHA"; exit 1; }
          echo "deploying $SHA" | tee -a "$GITHUB_STEP_SUMMARY"
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!v}" ]; then echo "::error::secret $v is not configured (see README → 部署)"; exit 1; fi
          done
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ inputs.sha || github.sha }}
          path: dist/
      - name: Deploy private site (Access + JWT gate)
        run: pnpm exec wrangler deploy -c wrangler.private.jsonc --message "main@${SHA}"
      - name: Deploy public site (static assets only)
        run: pnpm exec wrangler deploy -c wrangler.public.jsonc --message "main@${SHA}"
      - name: Smoke test
        run: bash scripts/smoke.sh
      - name: Report the deployed SHA (only after the smoke test passed)
        id: deployed
        run: echo "sha=$SHA" >> "$GITHUB_OUTPUT"
