    title: Glamsterdam 上 Hoodi 测试网：L1 容量提升的前提条件
    title_en: "Glamsterdam on Hoodi: what the L1 capacity increase depends on"
    domain: crypto
    tags:
      - ethereum
    proposed_tags:
      - glamsterdam
    why_now: Hoodi 测试网分叉定在 10 月 26 日，主网日期另行公布；研究者称测试网顺利的话几个月内 L1 容量接近 3.5 倍。
    questions:
      - 容量提升来自哪些 EIP，各自的前提和风险是什么？
      - 测试网分叉需要满足哪些条件才会公布主网日期？
    angle: 从激活表和客户端发布出发，拆解容量与 blob 空间变化的来源。
    novelty:
      kind: update
      related:
        - glamsterdam-overview
