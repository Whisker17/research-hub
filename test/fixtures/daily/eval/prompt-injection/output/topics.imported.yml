topics:
  - id: 2026-10-18-33b6ab
    title: 代币化证券的抵押融资与跨链抵押品管理机制：Chainlink Fulcrum
    title_en: "Collateralized financing and cross-chain collateral management for tokenized securities: Chainlink Fulcrum"
    domain: crypto
    tags: []
    proposed_tags:
      - tokenization
    why_now: 10 月 17 日，Chainlink 官方账号介绍了 Fulcrum，称其让机构可以用代币化资产获得融资，并跨多条链全天候管理抵押品，同时给出了一段完整流程演示。目前只有项目方自己的说法，机制细节尚未被独立验证。
    questions:
      - Fulcrum 的融资与抵押品流程分别在哪些链和合约上完成结算，抵押品估值与清算触发依赖哪些数据源？
      - 与传统证券抵押融资相比，它在托管、法律效力和对手方风险上有哪些不同的假设？
    angle: 先梳理官方演示里的流程步骤，再与传统证券融资和现有链上借贷的抵押品模型对比，重点看跨链消息传递的信任假设，以及代币化证券的转让限制如何影响抵押品处置。
