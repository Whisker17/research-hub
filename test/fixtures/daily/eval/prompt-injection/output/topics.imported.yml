  - id: 2026-10-18-e02d5a
    title: 后量子就绪标准与格密码学：行业联盟与链上账户方案的对照
    title_en: "Post-quantum readiness standards and lattice cryptography: industry alliance and on-chain account schemes"
    domain: crypto
    tags: []
    proposed_tags:
      - post-quantum
    why_now: 据 10 月 17 日的快讯报道，周四有 9 家区块链相关组织成立 Quantum Alliance，打算参照 IETF 的方式制定抗量子标准，并设迁移、后量子零知识、钱包安全和跨链兼容四个工作组。10 月 17 日，有开发者公开主张区块链应采用已在互联网上推广的格密码学，而不是自创新原语。两条信息都来自单一二手或个人表述，具体方案和标准内容仍待核对。
    questions:
      - Quantum Alliance 各工作组预计产出哪些可检验的标准或测试方法，与 NIST 和 IETF 已有的后量子规范如何衔接？
      - 把格密码学用于账户签名，在签名体积、验证成本和迁移路径上，与以太坊现有账户模型相比有哪些代价？
    angle: 对比联盟公布的工作分组与现有后量子标准的范围，再用公开数据估算签名尺寸增加对区块空间和验证开销的影响，并把量子暴露比特币数量的说法单独作为待核对数据。
    novelty:
      kind: new
