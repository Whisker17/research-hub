topics:
  - id: 2026-10-19-1e5e80
    title: Glamsterdam 将 gas limit 提至 200M 之后的状态增长约束
    title_en: State growth constraints after Glamsterdam raises the gas limit to 200M
    domain: crypto
    tags: []
    proposed_tags:
      - gas-limit
      - state-growth
    why_now: 据 nero_eth 引述以太坊基金会博客的公告，Hoodi 是主网前的最后一个测试网，相关升级排期在 10 月 26 日；Glamsterdam 上线后 gas limit 预计由 60M 升到 200M，并有人认为 300M 是下一个现实目标。同日该作者也提到，历史修剪和状态增长放缓并没有真正解决问题，长期可能仍需要状态分片、过期或分层。
    questions:
      - gas limit 从 60M 升到 200M 后，状态大小、带宽和同步时间的增长在客户端实测中是多少？
      - 超过 300M 需要通过硬分叉重新定价哪些资源，传播机制要做哪些优化？
      - 状态分片、状态过期、分层存储这几类方案各自的权衡是什么？
    angle: 对照公告中的升级参数与各客户端团队公开的基准数据，梳理 gas limit 与状态增长之间的关系，再比较已有的状态过期与分层提案。
    novelty:
      kind: new
      related: []
    references:
      - item_id: ethtao:2111717098271732040
        type: secondary
      - item_id: ethtao:2111782952065499341
        type: secondary
    evidence:
      independent_sources: 2
    confidence: medium
  - id: 2026-10-19-f937c7
    title: 以太坊后量子迁移：优先采用哈希签名还是格基签名
    title_en: "Post-quantum migration for Ethereum: hash-based versus lattice-based signatures"
    domain: crypto
    tags: []
    proposed_tags:
      - post-quantum
      - cryptography
    why_now: ladislaus0x 在参加以太坊基金会的后量子研发研讨周后，发布了个人笔记，涉及迁移路径、leanVM、形式验证和共识的未来。随后该作者在讨论中提出，以太坊最需要的是抗量子的签名而非加密，且基于哈希的签名只依赖哈希函数的安全性，与 ZK 证明的假设一致，相比 ML-DSA、Falcon 等格基方案更保守。需要注意这是个人观点，作者自述并非密码学家。
    questions:
      - 哈希签名与格基签名在签名体积、验证成本和聚合能力上的差距有多大，对账户与共识层各意味着什么？
      - 迁移到抗量子签名时，现有账户和验证者密钥的过渡方案有哪些？
    angle: 以研讨会笔记为线索，对比各方案的安全假设和链上成本，并查找以太坊基金会及研究者公开的相关提案与基准。
    novelty:
      kind: new
      related: []
    references:
      - item_id: ethtao:2111768536062595545
        type: secondary
      - item_id: ethtao:2111797433478836652
        type: secondary
    evidence:
      independent_sources: 2
    confidence: medium
  - id: 2026-10-19-929e36
    title: EthLib：用 Lean4 为以太坊协议建立共享的形式化验证库
    title_en: "EthLib: a shared Lean4 library for formal verification of Ethereum"
    domain: crypto
    tags: []
    proposed_tags:
      - formal-verification
    why_now: 10 月 18 日，tcoratger 公开征求对 EthLib 的意见，设想它是类似 Mathlib 的以太坊 Lean4 库，让规范、定理和证明可以在协议及各实现之间复用，并说明它的范围会比纯密码学更广。另一位开发者 leolarav 则介绍了自己团队基于共识层分叉实现搭建的现成规范库，认为 Lean Protocol 可以在其上构建。
    questions:
      - EthLib 与已有的共识层 Lean 规范库在范围和分工上如何划分？
      - 共享的形式化库对多客户端实现之间的一致性检查能提供什么保证？
    angle: 比较两个库的公开仓库结构、已覆盖的分叉与定理范围，并检查它们与 VCVio 等密码学库的整合方式。
    novelty:
      kind: new
      related: []
