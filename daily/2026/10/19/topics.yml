        type: secondary
    evidence:
      independent_sources: 2
    confidence: low
  - id: 2026-10-19-7b8210
    title: 证明者多样性与本地构建者：zkEVM 证明对 solo staker 的影响
    title_en: "Prover diversity and local block builders: implications of proving for solo stakers"
    domain: crypto
    tags: []
    proposed_tags:
      - zkevm
      - solo-staking
    why_now: 10 月 18 日，gballet 在两处讨论中表达了对证明机制的担忧：一是若区块证明无法由本地构建者完成，证明、构建和状态服务可能趋于集中，进而挤出 solo staker；二是证明者数量只有两三个时，出现分歧很难判断谁出错，形式验证要达到多样性带来的安全水平还需要时间。这些是个人立场，需要用实现与基准数据核对。
    questions:
      - 在目前公开的基准中，普通硬件上本地生成区块证明的成本与延迟是多少？
      - 需要多少个相互独立的证明者实现，才能在出现分歧时可靠地定位错误方？
      - 形式验证能在多大程度上替代证明者多样性？
    angle: 整理各 zkVM 与 guest program 的公开基准、硬件要求和多证明者设计，并对比以往执行与共识客户端多样性在事故中发挥的作用。
    novelty:
      kind: new
      related: []
