        type: secondary
      - item_id: ethtao:2112905153808417235
        type: secondary
    evidence:
      independent_sources: 3
    confidence: medium
  - id: 2026-10-22-cd6edb
    title: 代币化股票的链上交易与抵押化：Base 的 24/7 交易、币安保证金接入与 DEX 成交量
    title_en: "Tokenized equities on-chain: 24/7 trading on Base, exchange collateral adoption and DEX volume"
    domain: crypto
    tags: []
    proposed_tags:
      - tokenized-assets
      - rwa
    why_now: 10 月 21 日，Base 官方账号称 Tesla 与 Meta 的代币化股票在财报公布后继续在 Base 上全天候交易。同日币安公告，将 5 种 bStocks 代币加入全仓杠杆、组合保证金的合格抵押资产，并开放对应的杠杆交易对。ARK Invest 的第三季度 DeFi 报告称，代币化股票现货 DEX 成交量约 500 亿美元，约为上一季度的 9 倍，占现货 DEX 成交量的约 9%。三处材料各自说明代币化股票在交易时段、抵押用途和成交规模上的变化。
    questions:
      - 代币化股票在休市时段的价格由什么形成？与标的股票的价差和收敛机制在财报等事件前后表现如何？
      - 作为保证金抵押品时，托管、赎回与发行方信用风险如何传导？币安对这类资产设定了哪些折算率和限制？
      - ARK 报告中的成交量增长有多少来自真实的现货换手，有多少来自永续合约或激励带来的交易？
    angle: 对比发行方的托管与赎回条款、币安公告中的抵押规则，以及 ARK 报告的统计口径；再用链上数据核对 Base 上相关代币的流动性与休市期间的价差。
    novelty:
      kind: new
      related: []
    references:
      - item_id: ethtao:2113009938658361446
        type: primary
        note: Base 官方账号对链上代币化股票交易情况的陈述
      - item_id: odaily:526188
        type: secondary
      - item_id: odaily:526347
        type: secondary
