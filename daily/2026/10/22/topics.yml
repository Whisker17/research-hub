  - id: 2026-10-22-f65773
    title: Solana Alpenglow 主网上线：Votor 投票与证书机制如何改变最终性与验证者成本
    title_en: "Solana Alpenglow on mainnet: how Votor voting and certificates change finality and validator costs"
    domain: crypto
    tags: []
    proposed_tags:
      - solana
      - consensus
    why_now: 10 月 21 日，多家媒体报道 Solana 的 Alpenglow 升级在约 13:54 UTC 切换到主网，取代 TowerBFT。第一阶段的 Votor 以验证者直接投票加证书的方式确认交易，后续阶段的 Rotor 计划取代 Turbine 的区块数据分发。报道还称，逐笔链上投票费改为每个 epoch 固定收取 0.8 SOL 的准入费用，并提到此前经历过多次测试网重启和一次迁移回滚。各来源对升级前最终性时间的数字不一致（6.6 秒与 12.8 秒），目标值均为约 150 毫秒。
    questions:
      - Votor 的一轮与两轮确认路径在什么条件下分别触发？对网络分区和拜占庭验证者比例的容忍度与 TowerBFT 相比有何差别？
      - 投票移出链上、改为固定准入费后，验证者的实际成本与小型验证者的参与门槛发生了什么变化？
      - 上线后一段时间内，实测的最终性时间和出块表现与 150 毫秒的目标差距有多大？
    angle: 对照 Alpenglow 的公开规范和 Agave 客户端实现，梳理 Votor、Rotor 各阶段的协议行为；再用主网上线后的最终性与投票数据核对报道中的数字，并与以太坊的单时隙最终性路线做对比。
    novelty:
      kind: new
      related: []
    references:
      - item_id: odaily:526352
        type: secondary
      - item_id: theblock:421508
        type: secondary
      - item_id: odaily:526218
        type: secondary
    evidence:
      independent_sources: 3
    confidence: high
  - id: 2026-10-22-fb5454
    title: EIP-8037 与 EIP-8038 的 gas 重新定价：对已部署合约与隐私应用的影响
    title_en: "Gas repricing in EIP-8037 and EIP-8038: effects on deployed contracts and privacy applications"
    domain: crypto
    tags: []
    proposed_tags:
      - gas-repricing
      - privacy
    why_now: 10 月 21 日，pcaversaccio 在 X 上提出，这两份 EIP 即使不改合约字节码，也可能让依赖原有 gas 成本的合约行为改变，迫使其升级，并认为对 Tornado Cash、Railgun 这类隐私应用的成本影响没有被充分分析。lightclients 回应称，核心开发者已判断隐私流量受到的负面影响不是优先事项，但 gas 上限提到 2 亿后费用可能与今天持平。nero_eth 则指出 gas 用量只反映一半情况，基础费率反映的是需求与容量之比，供给扩大约 3.5 倍后绝对成本可能下降。以上均为个人陈述，需要用数据核对。
    questions:
      - 这两份 EIP 具体改动了哪些操作码或状态写入的 gas 成本？哪些已部署合约的行为会因此改变？
      - 隐私协议每次使用要写入的状态（承诺、nullifier）在新定价下成本变化多少？在 gas 上限抬升后，净成本是上升还是下降？
      - 硬分叉强制合约升级的风险，在以往的 gas 重新定价（如 EIP-1884、EIP-2929）中有哪些先例？
    angle: 阅读两份 EIP 的规范与讨论串，按隐私协议的典型交易路径估算 gas 变化；对照 chain_security 相关文章、ACD 会议记录，以及基础费率随容量变化的历史数据。
    novelty:
      kind: new
      related: []
    references:
