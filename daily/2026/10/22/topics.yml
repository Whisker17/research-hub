  - id: 2026-10-22-64e1b8
    title: SEACAST：以太坊广播层的可执行规范与形式化模型
    title_en: "SEACAST: a broadcast design for Ethereum with an executable specification and a formal model"
    domain: crypto
    tags: []
    proposed_tags:
      - p2p-networking
      - formal-verification
    why_now: 10 月 21 日 UTC 15:48，ethresear.ch 出现一篇题为 SEACAST 的帖子，标题称它是面向以太坊的快速精简广播方案，并附带可执行规范和形式化模型。帖子摘录为空，具体机制、性能数据与对比对象输入里都没有，需要以原文为准。
    questions:
      - 该方案要解决现有 gossip 或区块、blob 传播中的什么具体瓶颈？
      - 可执行规范与形式化模型各自验证了哪些性质？在多大规模的网络下做过评估？
    angle: 通读帖子和附带的规范，对照当前 libp2p gossipsub 以及以太坊 DAS 相关的传播方案，核对带宽、延迟与安全假设，并查看社区反馈。
    novelty:
      kind: new
      related: []
    references:
      - item_id: ethresearch:26167
        type: primary
    evidence:
      independent_sources: 1
    confidence: low
