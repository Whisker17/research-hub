      independent_sources: 3
    confidence: medium
  - id: 2026-10-22-c782a7
    title: 美国受监管的加密永续合约：Webull 经 Kalshi 上线与 Lighter 的 DCM、DCO 申请
    title_en: "Regulated crypto perpetuals in the US: Webull via Kalshi and Lighter's DCM and DCO applications"
    domain: crypto
    tags: []
    proposed_tags:
      - perpetuals
      - cftc
    why_now: 据华尔街日报报道，Webull 计划 11 月起向符合条件的美国客户提供加密永续合约，先从比特币开始，合约在受 CFTC 监管的 Kalshi 挂牌并由其清算机构清算。10 月 21 日，Lighter 的创始人在投资者会议上表示，计划 11 月向 CFTC 申请指定合约市场和衍生品清算组织牌照，监管审查期最长 280 天。另有 Mizuho 对 600 多名 Robinhood 用户的调查，称 94% 愿意交易个股永续合约，多数为新增资金。以上说法多来自单一来源，需要用一手文件核对。
    questions:
      - 永续合约在 CFTC 的框架下以什么法律形式存在？它的资金费率、清算与保证金规则与离岸交易所有何不同？
      - 链上撮合与清算的平台要满足 DCM、DCO 的哪些要求？Lighter 披露的前期沟通涉及哪些具体问题？
      - 受监管的永续合约对美国用户的杠杆倍数、可交易标的和强平机制有哪些限制？
    angle: 对照 CFTC 对 DCM、DCO 的申请要求与现有产品的备案文件，比较 Kalshi 清算机构的保证金模型与主流离岸永续的做法，再看后续实际上线的合约规格。
    novelty:
      kind: new
      related: []
    references:
      - item_id: odaily:526111
        type: secondary
      - item_id: odaily:526454
        type: discussion
        note: 未注明外部来源的快讯，仅用于补充 Lighter 的申请计划
      - item_id: theblock:421639
        type: secondary
    evidence:
      independent_sources: 2
    confidence: low
  - id: 2026-10-22-796504
    title: 加密 ETF 的实物申购扩展：灰度 10 只产品的 in-kind 机制与质押型 ETF 的运作
    title_en: "In-kind subscriptions expand across crypto ETFs: Grayscale's ten products and how staking ETFs operate"
    domain: crypto
    tags: []
    proposed_tags:
      - etf
      - custody
    why_now: 10 月 21 日，灰度宣布实物申购覆盖 10 只产品，包括比特币迷你信托、以太坊质押迷你 ETF，以及 Avalanche、Chainlink、Dogecoin、Hyperliquid、Solana、Sui、XRP、Zcash 相关产品。投资者可以直接交付符合条件的代币来换取份额，而无需先卖出换成现金。灰度称这能减少自行托管负担、降低潜在的执行成本，The Block 也报道了这一扩展。
    questions:
      - 实物申购在流程上如何完成？授权参与者、托管方和发行方之间的代币转移与记账是怎样安排的？
      - 对质押型产品，投入的代币在质押期、退出队列和赎回之间如何衔接？
      - 实物申购对份额溢价折价与套利效率的影响，在已开放的产品中有无可观测的数据？
    angle: 阅读灰度各产品的招募文件与申购赎回条款，对比已采用实物机制的其他 ETF 的运作和溢价数据，再整理其对质押和托管流程的约束。
    novelty:
      kind: new
