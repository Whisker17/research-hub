tweet: |-
  Is evm2 2x faster than revm? On public evidence: a real but smaller win. Its only public head-to-head shows 1.10-1.19x on 10 mainnet blocks vs revm 42.0.1. The README's "up to 2x" has no public benchmark.

  Why it matters: reth main replaced revm with evm2 on Oct 24. No reth release ships it yet.

  How to read the figure:
  • Left: revm sends every opcode through a central loop. pc, stack length and gas sit behind &mut Interpreter and go through memory.
  • Right: evm2 picks its dispatch backend at compile time (by default: tail calls on nightly, packed on stable 64-bit) and keeps those values in registers.

  Two details:
  • Gains shrink in block replay: one change cut 23-34% on compute benchmarks, but 4.8-6.2% on mainnet replay.
  • BAL, fiber async DB and a split tracing path already exist in recent revm. They are not reasons to switch.

  Caveat: evm2 has no release and no API stability promise, and its JIT is off by default.
