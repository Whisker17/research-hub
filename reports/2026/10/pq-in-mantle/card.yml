takeaway: "7702 is a migration helper, not a boundary. Real recovery requires smart accounts."
tweet: |-
  It's easy to assume EIP-7702 delegation provides a post-quantum failover for EOAs. It doesn't: 7702 does not strip an EOA's classical ECDSA root authority.

  If an attacker recovers your ECDSA key using Shor's algorithm, 7702 offers zero protection:
  • Direct call bypass: 7702 EOAs are exempted from EIP-3607 and can still initiate top-level transactions. An attacker calls tokens directly, skipping delegated verification.
  • Delegation revocation: The attacker can broadcast a new authorization tuple to overwrite or revoke delegation at the protocol level.

  How to read the figure:
  • Left (7702 EOA): Delegated code never executes when an attacker calls external contracts directly.
  • Right (Smart Account): Contract accounts cannot be transaction senders under EIP-3607. All outflows must pass internal logic enforcing PQ verification.

  What about on-chain verification?
  Pure EVM ML-DSA verifiers cost ~1.2M gas, exceeding ERC-7562's 500k mempool cap. L2s need native precompiles.
