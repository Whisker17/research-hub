title: "Why EIP-7702 is not post-quantum disaster recovery"
background: "Quantum Shor's breaks ECDSA signing. True disaster recovery requires non-bypassable account controls."
context: "EIP-7702 allows EOAs to delegate execution to smart contracts, sparking claims of instant PQ failover."
