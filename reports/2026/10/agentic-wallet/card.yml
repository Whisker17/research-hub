quote: https://x.com/MetaMask/status/2110426474071097697
title: "Big-four agent wallets: limits off-chain or undisclosed"
background: An agent wallet lets an AI sign and pay within limits. Which layer enforces a limit decides if it holds.
context: "MetaMask appears to bring Agent Wallet to a bot; Coinbase, OKX and Binance launched theirs in 2026."
figure:
  caption: Where surveyed agent wallets enforce limits
  excalidraw:
    defaults: { fontSize: 20 }
    nodes:
      - { id: skill, label: "Skill rule:\nconfirm first", x: 0, y: 36, w: 170, h: 84, color: red }
      - { id: vendor, label: "Server / TEE:\ncaps, allowlists", x: 195, y: 36, w: 180, h: 84, color: blue }
      - { id: chain, label: "Contract:\nscoped access", x: 400, y: 36, w: 170, h: 84, color: green }
    texts:
