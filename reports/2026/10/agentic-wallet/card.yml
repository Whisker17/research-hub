      - { x: 199, y: 0, text: "Vendor enforces", fontSize: 21, color: blue }
      - { x: 404, y: 0, text: "On-chain examples", fontSize: 21, color: green }
findings:
  - stat: "$44K"
    text: "x402 moved ~$44K in 24h (Artemis, Oct 19); 30-day transactions fell 46%."
  - stat: "Permit2"
    text: "MetaMask's agent outflow limit does not count signed approvals like Permit2."
takeaway: Judge an agent wallet by where its policy runs and what its limit skips, not by key custody.
tweet: |-
  Across MetaMask, Coinbase, Binance and OKX, key custody ranges from TEE and MPC to local keys. The harder question is where limits run: for these four, policy is vendor-side or undisclosed.

  "Confirm every transfer" is often only a skill rule. An injected agent can skip it.

  How to read the figure:
  • Left: skills or tool flags that ask for confirmation.
  • Middle: vendor-side caps and allowlists (MetaMask Guard, Binance API, OKX portal). MetaMask and Binance also check risky actions on the server or in the app.
  • Right, examples: on-chain sessions and allowances (Altana, Crossmint, Safe). Altana and Crossmint reject out-of-scope calls on chain.

  Two details:
  • A limit is not a loss cap. MetaMask's limit skips Permit2 signatures, and pausing an agent does not void a signed EIP-3009 authorization.
  • x402 moved ~$44K in 24h, ~$0.40 per payment (Artemis, Oct 19).

  Caveat: an Altana session with no calls list can call any contract within its cap. Scope: surveyed wallets, Oct 2026.
