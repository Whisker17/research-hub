title: "Uniswap v4 hooks: what actually needs v4"
background: A v4 hook is fixed to a pool at creation; enabled callbacks run except when the hook itself calls.
context: Uniswap shipped Permissioned Pools in Jul 2026; SMBC Nikko and Nethermind plan a v4-hook gateway.
