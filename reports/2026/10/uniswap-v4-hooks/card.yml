findings:
  - stat: "~$12M"
    text: "Settlement checks do not catch hook-system bugs: Cork ~$12M, Bunni ~$8.4M."
  - stat: 2 layers
    text: "RWA: token rules miss 6909 claims and hops; pool gates miss later transfers."
takeaway: v4 adds pool-wide rules and custom accounting; proving the accounting sound is the hook's job.
tweet: |-
  v3 already has swap callbacks. v4 adds pool-level rules for external callers and lets hooks replace the pricing curve and accounting.

  Why: v3 callbacks go to the caller; router-only rules can be bypassed. v4 runs enabled hook callbacks, except on calls from the hook itself.

  How to read the figure (unmodified v3 core):
  • Left: multi-range concentrated-liquidity launches and token transfer rules work on v3.
  • Right: pool-level access checks, per-swap fees and custom curves need hooks.

  Two details:
  • PoolManager requires each outstanding delta to clear, but does not verify hook accounting. Cork (~$12M) had an authorization bug; Bunni (~$8.4M), a rounding bug.
  • For tokenized real-world assets, token checks miss internal claims and intermediate trades; pool gates do not govern later transfers.

  Caveat: curve-to-liquidity graduation in the same pool needs v4 rather than v3. untoll-hook is a testnet-only, unaudited example.
