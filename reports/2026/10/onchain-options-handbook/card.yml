tweet: |-
  Onchain options need more than matching. Leading venues match or quote offchain and settle onchain; the main bottleneck is sellers' access to hedges and the cost of capital.

  Why it matters: buyers risk their premium. Sellers bear jump risk, even after hedging.

  How to read the figure (leading venues, Oct 2026):
  • Left: Derive, Paradex and Rysk match or quote offchain and settle onchain.
  • Right: hedging access and collateral costs constrain sellers.

  Two details:
  • Example: one delta-hedged short at-the-money ETH call loses $27–30 on an instant ±10% move (ETH $2,500, 30 days, implied volatility 60%, zero interest).
  • On Oct 16, DefiLlama's 30-day options notional was ~$5.07B; Derive had 83.7%. Deribit's option open interest was ~25× Derive's on Oct 1.

  Caveat: Lyra attributed earlier option-pool losses to pricing and missing hedges. Surveyed Opyn, Ribbon and Typus exploits involved exercise or oracle flaws.
