title: 后量子签名选型：哈希路线 vs 格路线，以及 EIP-8288 想做的“第三条路”
summary: 这场争论其实是三个选择：签名算法、聚合证明、协议接口。Ethereum 在协议层押哈希，a16z 押格，两边的聚合方案都还不能上生产；EIP-8288 想让协议不再为任何算法加预编译，但当前草案只支持一种哈希签名。第二篇的近期方案仍成立，但要改定位、地址区间和时间线
