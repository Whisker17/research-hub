title_en: 'Choosing Post-Quantum Signatures: Hash-Based vs Lattice-Based, and the "Third Path" of EIP-8288'
summary_en: "The debate is really three choices: the signature scheme, the aggregation proof, and the protocol interface. Ethereum bets on hashes at the protocol layer and a16z bets on lattices; neither aggregation stack is production-ready. EIP-8288 wants the protocol to stop adding a precompile per algorithm, but the current draft supports only one hash-based signature. Part 2's near-term plan still holds, with a new positioning, address range and timeline."
