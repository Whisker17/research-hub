tweet: |-
  "Hash vs lattice" is three choices: signatures, aggregation proofs, and protocol interfaces. Starknet shows the mix: hash-based STARK proofs and published Falcon-512 account code, including OpenZeppelin's experimental, unaudited implementation.

  How to read the figure:
  • Signature: hash-based (leanXMSS, leanSPHINCS) or lattice (Falcon, ML-DSA).
  • Aggregation: a hash-based STARK with recursion (leanVM) or a lattice SNARK without recursion (Aerie).
  • Interface: one precompile per scheme, or EIP-8288 dependency frames with one recursive STARK per block.

  Two details:
  • Aerie's default aggregate for 32,768 signatures is 1,346 KiB, since each keeps a 40 B salt. The estimated 66 KiB needs a common salt and an extra assumption.
  • EIP-8288 charges about 33,000 gas per leanSPHINCS dependency. Its generic STARK route is still reserved.

  Caveat: Aerie is a research release; leanVM is not production-ready. leanVM changed signature schemes on Oct 17.
