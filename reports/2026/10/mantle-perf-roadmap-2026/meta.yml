title_en: "Mantle's 2026 Performance Roadmap: Review and Experiment Plan"
summary_en: The draft points the right way, but the mainnet sequencer is still op-geth, a reth preconf commitment can be lost on power loss or failover, and the prover runs one range at a time. First build the config inventory, audit commitments, and diagnose proving and storage; then decide on short blocks, evm2, parallel EVM and the commitment by measurement.
