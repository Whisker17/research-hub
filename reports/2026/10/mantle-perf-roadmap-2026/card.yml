  - "Lower 1559 denominator: faster fee response, not more execution capacity."
takeaway: Name the client, load mix and commitment level before you trust an L2 performance number.
tweet: |-
  Before tuning an OP Stack L2, check what your benchmark measures. Three numbers mislead easily: DA footprint, block-level p99, and the effect of EIP-1559 parameters.

  Why it matters: a wrong reading sends roadmap work to the wrong layer.

  How to read the figure (Jovian rules, default scalar 400):
  • Left: a plain transfer uses 21,000 gas.
  • Right: its footprint is at least 100 estimated bytes x 400 = 40,000. Base-fee updates use the larger block total.
  Hitting the footprint limit first shows a metering limit, not that blob bandwidth is full.

  Two details:
  • 40 blocks yield 0.4 expected observations above the true p99. With 900 independent samples, the 4th to 16th largest bracket the true p99 with about 96% confidence.
  • Fee change scales with 1/denominator. For example, with elasticity 4 and denominator 50, each full block raises base fee 6%; 40 full blocks give about 10.3x.

  Caveat: fee parameters shift price-sensitive demand; they do not add execution, DA or proving capacity.
