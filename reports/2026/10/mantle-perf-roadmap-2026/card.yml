title: Three traps in benchmarking an OP Stack L2
background: "Jovian updates base fee from the larger block total: execution gas or scaled DA footprint."
context: "Reth v2.9.0 moved to evm2 on Oct 29; Base targets 200 ms canonical blocks on mainnet in November."
