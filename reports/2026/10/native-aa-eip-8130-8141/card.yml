title: "Native AA: two drafts split on where agent limits live"
background: Native account abstraction drops ERC-4337 bundlers and EntryPoint; sponsorship and batching go native.
context: "Drafts: EIP-8141 is scheduled for inclusion in Hegota; EIP-8130 remains on Base devnets."
