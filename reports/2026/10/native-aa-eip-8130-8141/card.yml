takeaway: Tracking Ethereum L1 points to 8141; tracking Base points to 8130. Both are still drafts.
tweet: |-
  Native account abstraction removes ERC-4337 bundlers and the EntryPoint. EIP-8130 and EIP-8141 agree on that; they split on where a scoped agent's limits are enforced: protocol rules (8130) or account bytecode (8141).

  Why it matters: agent sub-keys need hard limits on targets, functions and spend. Both drafts sponsor gas and batch calls natively.

  How to read the figure:
  • Left, 8130: Actors are registered in the protocol; a Policy Manager checks scope before calls run.
  • Right, 8141: the protocol pre-validates signatures; a VERIFY frame runs account code that inspects later frames and calls APPROVE.

  Two details:
  • 8141 alone has one scalar nonce; parallel lanes need EIP-8250 keyed nonces. 8130 has 2D nonces and windowed nonce-free txs.
  • Draft base gas: 8130 AA_BASE_COST 15,000; 8141 12,000 + 475 per frame.

  Caveat: all three are drafts. 8141 is an SFI item for Hegota (ACDE #244); 8130 runs only on Base devnets. 8130 allows only whitelisted authenticators.
