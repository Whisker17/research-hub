title: "Papertrade: winners pay fees, losers mint the token"
background: In vault-counterparty perps, no order book matches trades; a protocol vault takes the other side.
context: "Live on HyperEVM since Oct 10; a day later the team cited manipulation attempts and tightened OI caps."
figure:
  caption: Per close, settled vs the vault at BBO mid
  excalidraw:
    defaults: { fontSize: 21 }
    nodes:
      - { id: win, label: "Impact haircut\n+ 2% fee", x: 0, y: 36, w: 250, h: 84, color: blue }
      - { id: loss, label: "Mints PAPER\nup to 100 per $1", x: 300, y: 36, w: 270, h: 84, color: green }
    texts:
      - { x: 4, y: 0, text: "Winning close", fontSize: 22, color: blue }
      - { x: 304, y: 0, text: "Losing close", fontSize: 22, color: green }
findings:
  - stat: "~80%"
    text: "By Oct 12: $27.26M USDC to stakers vs $34.13M net trader losses (~80%)."
  - stat: "~$100B"
    text: "Launch OI cap: ~$100B per side for 9.5 h, not the documented OI + $1B."
takeaway: Price is one book's BBO mid, no deviation breaker; OI caps are the key control, not a loss cap.
tweet: |-
  Papertrade is a synthetic perp venue on HyperEVM. A protocol vault takes the other side of every trade at Hyperliquid's BBO mid. The dividing line is how a close settles: winners pay fees, losers mint PAPER, whose stakers get the vault's surplus.

  Why it matters: the vault is the only counterparty; no funding rate rebalances skew.

  How to read the figure:
  • Left: profits lose a 0.2 bps deadband, a Rollbit-style impact haircut, then 2%; a 0.1% BTC move keeps 72.4%.
  • Right: losses mint PAPER, 100 per $1 early, ~29 at the margin by Oct 12.

  Two details:
  • The vault is capped near $5M; the excess and a fee share went to stakers: $27.26M USDC, ~80% of traders' net loss.
  • The launch OI cap was ~$100B per side for 9.5 hours. Media report a wallet pushed ETH ~0.12% on Hyperliquid while holding large Papertrade positions.

  Caveat: data as of Oct 12; incident figures are unverified media reports. Contracts are upgradeable (7-day timelock), so "mint only on losses" is not hard-coded.
