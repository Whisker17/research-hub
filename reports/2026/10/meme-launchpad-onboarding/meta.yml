title_en: "System Onboarding: How the 7702 Smart Account, the Meme Launchpad and OpenClaw Work Together"
summary_en: How an AI agent uses a limited, revocable, gasless session key to launch and trade tokens for its user on a meme launchpad on Mantle Sepolia. The page first explains the 7702 SDK, the components the launchpad adds and how the system runs as a whole, then takes apart a real run from 2026-10-22 in nine steps, and ends with the security model and trust boundaries, technology choices, known limits and a code map.
