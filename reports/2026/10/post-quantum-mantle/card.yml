title: "Post-quantum: L1 upgrades do not cover all of L2"
background: A large quantum computer could break EVM signatures, KZG and curve-based SNARKs; hashes lose margin.
context: "Aztec: choose PQ schemes in 2027, migrate by 2030. Ethereum's Dec 2029 target is L1-only."
figure:
  caption: L1-settled L2s adopting new blob formats
  excalidraw:
    defaults: { fontSize: 21 }
    nodes:
      - { id: l1, label: "BLS consensus\nKZG blobs", x: 0, y: 36, w: 250, h: 84, color: green }
      - { id: l2, label: "ECDSA upgrade multisig\nBN254 SNARK verifier", x: 300, y: 36, w: 270, h: 84, color: red }
    texts:
      - { x: 4, y: 0, text: "L1 protocol migration", fontSize: 22, color: green }
      - { x: 304, y: 0, text: "L2-managed examples", fontSize: 22, color: red }
findings:
  - stat: BN254
    text: "SP1 / RISC Zero: STARK-to-BN254 wrapping is not post-quantum."
  - stat: "~37×"
    text: "ML-DSA-44: 2,420 B (~37× ECDSA); unaudited verifiers: ~1.2M–8.1M gas."
takeaway: No project surveyed is fully PQ; L2s need their own migration plans, not just L1 upgrades.
tweet: |-
  It's easy to assume L2s are covered once Ethereum goes post-quantum. Only partly: Ethereum's Dec 2029 PQ target is the L1 protocol itself (execution, consensus, data).

  Why it matters: a large quantum computer could forge ECDSA and BLS signatures and break KZG and BN254 SNARKs. Hashes mostly hold.

  How to read the figure (L2s that settle on L1):
  • Left: BLS consensus and KZG blob commitments come with L1's migration, if the L2 adopts the new blob formats.
  • Right, examples: ECDSA upgrade multisigs and BN254 SNARK verifiers on L1. No L1 fork migrates these; each L2 has to.

  Two details:
  • SP1 and RISC Zero wrap their STARK proofs in a BN254 SNARK for L1 verification. That final on-chain step is not post-quantum.
  • PQ signatures are big: ML-DSA-44 is 2,420 B (~37× ECDSA); unaudited on-chain verifiers cost ~1.2M–8.1M gas.

  Caveat: EIP-4844 reserves room for a PQ commitment switch, but contracts that verify KZG proofs may still need changes. No surveyed project is fully PQ yet.
