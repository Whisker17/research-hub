title_en: "Post-Quantum from First Principles to Roadmap: What Ethereum, Starknet and Aztec Are Doing, and What Mantle Can Do Now"
summary_en: Quantum computers threaten signatures and proofs, not hashes. Ethereum's 2029 target covers only the L1 protocol. Mantle's state security rests on one BN254 PLONK verification and a set of ECDSA multisigs with no timelock, and Mantle must migrate both itself. The inventory, permission hardening, PQ account prototypes and proof-path design with Succinct can start now.
