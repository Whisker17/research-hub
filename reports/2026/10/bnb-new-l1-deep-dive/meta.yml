title_en: "BNB New L1 Deep Dive: Native AA, Async Execution, 20 ms Sub-blocks, a Shielded Pool and LtHash"
summary_en: New L1 complements BSC rather than replacing it and runs only as an internal devnet. Its core change is that votes sign only the order while execution lands D blocks later; the parallel EVM is still in design. Its 0x76 AA matches Tempo almost item by item. The shielded pool can call public DeFi anonymously but is unaudited and BNB-only. Lattice appears only in the LtHash state commitment; no part of the stack uses PQ signatures, and a ~2^81 collision attack exists on the same parameters.
