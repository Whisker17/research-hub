tweet: |-
  "Faster, parallel BSC" misses the key point of BNB Chain's New L1 docs: validators vote only on transaction order, and execution results land D blocks later. The parallel EVM gets one sentence: "Detailed design is in progress."

  How to read the figure:
  • Left: block N carries only the order, no state root.
  • Middle: BLS votes finalize the order in ~2 blocks (a target; devnet only).
  • Right: block N+D carries the execution commitment; validators abstain if their own run disagrees.

  The price: admission uses state D blocks old, so fees cover the full declared gas limit, with no refund.

  Two details:
  • The 0x76 AA tx shares its type byte, 12 field names, precompile name and gas constants with Tempo's (addresses differ).
  • The "lattice" part is LtHash, a state commitment, not a PQ signature. A Sept 2026 paper puts collisions on these parameters at ~2^81 hash queries.

  Caveat: the ~20 ms preconfirmation target is a revocable producer promise, not a consensus guarantee.
