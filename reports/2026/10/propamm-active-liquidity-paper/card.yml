takeaway: "Our read: Tessera shows why quoted spreads alone cannot establish execution quality."
tweet: |-
  A new paper (arXiv 2609.38056) measures a year of propAMM trading on Solana, Base and Monad. It finds propAMMs earn +0.37 to +1.69 bps of markout 2 s after a trade, while passive AMMs lose 0.22 to 2.06 bps. Part of that edge is paid by users.

  Why it matters: passive AMMs reprice only when traded against, so arbitrageurs pick off stale quotes. A propAMM's maker pushes price updates on-chain.

  How to read the figure (paper's averages):
  • Left: passive AMMs, negative on all three chains.
  • Right: propAMMs, positive on all three.
  Markout = fill price vs Bybit microprice 2 s later.

  Two details from the paper:
  • Tessera on Base uses up to six penalty components; volume-weighted fees rise from ~0.44 bps nominal to 1.95 bps realized.
  • Only 39% of its trades fill at the quoted price: default fees rise near block start and reset near block end.

  Caveat: in calm markets (a retail proxy), flow still pays less on propAMMs: 0.26–1.62 vs 1.38–8.60 bps. Markout excludes gas and hedging.
