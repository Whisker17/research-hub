title: EIP-8288 深度解析：递归 STARK mempool、AggLayer 对照与递归证明安全之争
summary: EIP-8288 把验签变成由 mempool 每秒递归聚合的区块“依赖”，当前草案只接受 leanSPHINCS；AggLayer 只共享“证明里验证证明”这一原语，逐链结算且非 PQ；a16z（Justin Thaler）指出的递归安全缺口真实且双方都承认，但已知攻击需自选电路，未见对 8288 的可利用漏洞
