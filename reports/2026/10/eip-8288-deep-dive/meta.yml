title_en: "EIP-8288 Deep Dive: Recursive STARK Mempools, an AggLayer Comparison, and the Recursion Security Debate"
summary_en: EIP-8288 turns signature checks into block-level dependencies that the mempool aggregates recursively every second; the current draft accepts only leanSPHINCS. AggLayer shares only the proof-verifies-a-proof primitive, settles per chain and is not PQ. The recursion security gap that a16z's Justin Thaler points to is real and both sides admit it, but known attacks need a chosen circuit and we found no exploitable flaw in 8288.
