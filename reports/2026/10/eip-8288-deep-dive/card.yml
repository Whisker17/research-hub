tweet: |-
  Is EIP-8288 built on a fragile assumption? Partly fair. Its hash-only design relies on recursive Fiat–Shamir soundness, for which no proof is known in the plain random-oracle model. The EIP lists it as a trust assumption. We found no exploitable flaw in the current draft.

  How to read the figure:
  • Theory: ePrint 2024/728 rules out relativized succinct arguments in the ROM; leanVM's formal-verification project (leanerVM) leaves recursive extraction open.
  • Known attacks (KRS 2025/118, Fenzi 2026/1838) need the attacker to choose what is proved, a circuit or a program. We found none against fixed-circuit STARK recursion.
  • Draft today: leanSPHINCS only, so the recursion tree holds only the protocol's fixed circuit.

  Two details: the draft caps a mode 1 wrapper at 16 signatures, yet one wrapper must cover all active txs. And the draft's client-side wrapper route needs leanSTARK (0x11), still reserved.

  Caveat: lattice SNARKs like Aerie also rely on the (classical) ROM.
