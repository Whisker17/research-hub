title_en: "Mantle Aggregator Optimal Routing: Empirical Evaluation of 19 Algorithms"
summary_en: On identical frozen snapshots, shared-pool split routing reduces slippage by 3.9 bps on average compared to Uniswap SOR ports; 4-hop history label search nears known theoretical optima. Outlines next steps for connecting algorithms to live state and eth_call validation.
