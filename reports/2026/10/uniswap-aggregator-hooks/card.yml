title: "Uniswap Aggregator Hooks: a v4 pool with no v4 reserves"
background: A v4 hook can return a delta that replaces pool pricing; PoolManager only checks all deltas net to zero.
context: "Oct 22: Uniswap said v4 is now an aggregator: 7 sources across Ethereum, Base and Robinhood Chain."
