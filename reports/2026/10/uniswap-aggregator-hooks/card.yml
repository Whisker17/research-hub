takeaway: "Not another 1inch: routing stays offchain, venues become v4 pools; most add a 1–10 bp fee."
tweet: |-
  Aggregator Hooks do not move Curve, Fluid or V3-fork liquidity into Uniswap. An adapter hook trades on the source venue inside beforeSwap, then returns a delta that cancels v4's own curve. The "pool" is a PoolKey with no v4 reserves.

  Why it matters: any v4 router can quote these venues and settle them in one unlock with native pools. A partial fill leaves a non-zero delta, so the swap reverts.

  How to read the figure:
  • Left: what lives in v4, the PoolKey and the delta ledger.
  • Right: what stays at the venue, its reserves, pricing and fees.

  Two onchain details (Dune, to Oct 24):
  • The hooks have run swaps since Apr 2026. In the last 16 days, 99.6% of ~$250M Ethereum hook volume was LitePSM stablecoin conversion, which pays no protocol fee.
  • Ethereum non-PSM virtual pools: mostly 10 bp, some stable pairs 3 bp. LitePSM and UniswapX are excluded. Lifetime protocol fees: ~$2,500.

  Caveat: ~70% of post-launch hook swaps used Uniswap's Universal Router; that sample spans 1.5 days.
