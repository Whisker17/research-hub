title: "Surveyed EVM apps rarely control block order"
background: "App-specific sequencing (ASS): an app sets the order of its own transactions, e.g. cancels before takes."
context: "ethresear.ch's ACE post proposes consensus-enforced app rules; Tempo runs a payment lane, BSC plans one."
figure:
  caption: What a block validity rule can enforce
  excalidraw:
    defaults: { fontSize: 21 }
    nodes:
      - {
          id: ok,
          label: "Lane gas caps, floors

            Category segment order",
          x: 0,
          y: 36,
          w: 285,
          h: 84,
          color: green
        }
      - { id: no, label: "FCFS arrival time\nNo censorship", x: 315, y: 36, w: 255, h: 84, color: red }
    texts:
