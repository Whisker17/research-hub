      - { x: 319, y: 0, text: "Not checkable", fontSize: 22, color: red }
findings:
  - stat: "~99.5%"
    text: "Base Angstrom L2: factor 200, ~120k gas swaps send ~99.5% of bids to app."
  - stat: 30M
    text: "Tempo caps non-payment gas at 30M of 500M; no FCFS, no fee isolation."
takeaway: "Capacity and order are separate tiers: lanes split space by category, each lane sets its order."
tweet: |-
  Surveyed EVM designs mostly use contract locks, fee taxes or builder policies, not protocol-enforced app ordering. Tempo's live payment lane and BSC's planned lane allocate capacity, not order.

  Why it matters: enforcement sets the trust model. Contract locks revert calls; builder rules depend on builder compliance.

  How to read the figure:
  • Left: gas caps, floors and category order are checkable from block contents.
  • Right: arrival order and absence of censorship are not checkable from block contents alone.

  Two details:
  • Base Angstrom L2: factor 200 and ~120k gas per swap yield ~99.5% of bids for the app. The auction relies on priority-fee ordering.
  • Tempo caps non-payment gas at 30M; BSC plans a default 5% payment reserve. Neither lane adds first-come-first-served (FCFS) ordering or fee isolation.

  Caveat: BSC's lane is not active. Builder-specific ordering can vanish silently on rollup-boost's local fallback. Survey: 2026-10-11.
