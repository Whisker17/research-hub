takeaway: Products shaped NEAR's accounts and shard map; the async VM stayed, so Intents works around it.
tweet: |-
  NEAR Intents moved $4.41B in 30 days, yet a swap is not atomic end to end. NEAR contract calls are async, so Intents nets balances inside one contract, intents.near. Bridge deposits and exits sit outside that step.

  Why it matters: a failed NEAR callee does not roll back the caller; only a batch on one contract is all-or-nothing.

  How to read the figure:
  • Left: one execute_intents batch. User and solver sign token_diffs; each token must net to zero or it reverts.
  • Right: Omni, PoA and HOT bridges, each with its own trust model (MPC-signed Omni exits, a central PoA operator).

  Two details:
  • Distribution is external: SwapKit and Rango lead 24h referrals; 30-day fees (~$7.38M) are ~52× NEAR L1 gas.
  • Confidential Intents hides balances from the public chain, not from its operators. NEAR AI inference runs off-chain. Neither publishes usage data.

  Caveat: $4.41B is DefiLlama's count; the Intents explorer shows $3.26B. As of 2026-10-07.
date: 2026-10-07
