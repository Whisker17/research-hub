title: "NEAR Intents: swaps are atomic only inside one contract"
background: On NEAR, cross-contract calls are async receipts; a failed callee does not roll back the caller's state.
context: "Since July: Confidential Intents (B2B) and IronClaw 1.0 shipped; gas keys and dynamic sharding are live."
