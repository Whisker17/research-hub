title: NEAR 深度拆解：分片链架构、Intents / Privacy / AI 产品栈与生态
summary: NEAR 的 Intents、Privacy、AI 不共用一个 VM，而是共用账户与授权、intents.near 账本和一个同时做签名 / CKD / 外链验证的 MPC 网络。用户真正接受的是跨链兑换（30 天 44 亿美元，靠外部渠道分发）；产品驱动 infra 只在账户层和分片布局成立。附 Mantle 启示：NEAR Intents 目前不支持 Mantle。
