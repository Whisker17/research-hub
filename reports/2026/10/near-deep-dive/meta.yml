title_en: "NEAR Deep Dive: Sharding Architecture, Intents/Privacy/AI Stack & Ecosystem"
summary_en: NEAR's Intents, Privacy, and AI stacks share accounts, an intents.near ledger, and an MPC network rather than a single VM. Users primarily consume cross-chain swaps ($4.4B in 30 days via external distribution); product-driven infra holds only at the account and sharding tiers.
