takeaway: Removing migration does not remove sniping; Bankr's agent spending caps remain server-side.
tweet: |-
  Some meme launchpads sell tokens on a bonding curve before moving funds into a trading pool. That transition, called graduation, can expose funds to a pool an outsider initializes first.

  Why it matters: in Feb 2025, four.meme lost ~$183K after migration accepted a pre-created pool's distorted price.

  How to read the figure:
  • Left: four.meme's external-pool migration exposed it to pre-initialization.
  • Right: Pons V2 keeps the same pricing asset, but graduation has two stages and pool creation is retryable. Clanker and Zora skip the curve.

  Two details:
  • On the classic pump.fun curve, the first 30 SOL of net inflow buys 53.65% of total supply, favoring early buyers.
  • Bankr's default $500/24h agent spending cap is enforced server-side, not on-chain.

  Caveat: atomic migration does not stop curve front-running. Burning liquidity-provider tokens prevents liquidity withdrawal, not insider selling. Scope: surveyed launchpads, Oct 2026.
