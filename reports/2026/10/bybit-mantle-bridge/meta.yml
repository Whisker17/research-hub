title_en: Is Mantle a Free Bridge for Bybit Users?
summary_en: "Tests the idea that Bybit users treat Mantle as a free bridge with 90 days of on-chain data. It does not hold: only 2.1% of retail users who withdraw to Mantle go on to any bridge, and at real fees routing via Mantle saves money only for Ethereum, OP and Monad. Bybit makes about 2.96M USDT withdrawals a month, and volume follows counterparties and use, not withdrawal fees. The report proposes two product directions, cross-chain routing and a free USDT rail, and lists the decisions needed."
