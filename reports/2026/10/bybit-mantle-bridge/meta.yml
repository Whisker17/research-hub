title: Bybit 用户会把 Mantle 当成免费跨链桥吗？
summary: 用 90 天链上数据检验“Bybit 用户把 Mantle 当免费跨链桥”：假设不成立，散户提现到 Mantle 后只有 2.1% 进入任何一座桥；按真实费率，经 Mantle 只在以太坊 / OP / Monad 更省。Bybit 每月约 296 万笔 USDT 提现，量跟着对手方和用途走，不跟着提现费走。据此给出跨链路由与“免费 USDT 轨道”两个产品方向，以及需要拍板的问题。
