title_en: Starknet's Account Model, Post-Quantum Migration, and STRK20 / Shadow Accounts
summary_en: Starknet's PQ confidence rests on a hash-based proving layer and native accounts with no fixed signature scheme, but mainnet has moved only the proving layer and two hashes off elliptic curves, and a PQ L1 by 2027 is an option with no defined scope. STRK20 and Shadow Account confidentiality rests on ECDH and does not inherit the proving layer's PQ property.
