title: "Starknet: post-quantum signatures need no hard fork"
background: "Starknet has no EOAs: every account is a contract, and its __validate__ picks the signature scheme."
context: "Oct 8: Starknet is \"actively considering\" an L1 with a 2027 PQ target; no scope has been defined."
