takeaway: PQ signatures need no Starknet hard fork, but existing accounts still need explicit migration.
tweet: |-
  Starknet's PQ case leans on its account model. The dividing line: for EOAs and EIP-7702 accounts, the protocol fixes a secp256k1 root key. On Starknet, the protocol calls the account contract's __validate__, and the contract picks the scheme.

  So PQ signatures need no hard fork: a new account class, or an in-place class swap that keeps address and storage.

  How to read the figure:
  • Left: after a 7702 delegation, the old key can still send and re-delegate.
  • Right: __validate__ must return VALID within a 100M L2 gas cap.

  Two details:
  • OZ's SHAKE-direct Falcon-512 benchmark: ~385× Stark-ECDSA validation gas (61.9M of 100M). Mainnet demo; experimental, unaudited.
  • STRK20 Shadow Accounts are keyless proxies driven through the privacy pool. Balances and calls are public; only the wallet link is hidden.

  Caveat: existing Stark-ECDSA accounts need migration authorized by the old key; other legacy signing paths must move too. Scope: mainnet v0.14.4, Oct 2026.
