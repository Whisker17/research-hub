title: "CFMM routing: shadow prices decide each pool's trade"
background: CFMMs are rule-based trading pools; splitting a large swap can reduce price impact.
context: "Diamandis et al. (FC 2023) solve routing by dual decomposition: one price per token, pools in parallel."
figure:
  caption: "Model: fixed snapshot, known pools, no gas"
  excalidraw:
    defaults: { fontSize: 21 }
    nodes:
      - { id: paths, label: "Candidate paths\n+ share search", x: 0, y: 36, w: 250, h: 84, color: gray, stroke: dashed }
      - {
          id: dual,
          label: "Token shadow prices

            + per-pool arbitrage",
          x: 290,
          y: 36,
          w: 280,
          h: 84,
          color: green
        }
    texts:
      - { x: 4, y: 0, text: "Path-first (common)", fontSize: 22, color: gray }
      - { x: 294, y: 0, text: "Pool-level (this paper)", fontSize: 22, color: green }
findings:
  - stat: "200k"
    text: "Toy no-fee example, sell 100 ETH: one pool 150k USDC; 50/50 split 200k."
  - stat: "gap ≈ 0"
    text: "Optimality is certified: in a 3-pool example, dual bound = feasible output."
takeaway: Optimal here means optimal in the model; turning it into an on-chain trade is a separate step.
tweet: |-
  How should a large swap be split across CFMM pools? Diamandis et al. (FC 2023) optimize each pool's trade; paths are read from the resulting flows.

  Why it matters: paths sharing a pool draw on the same liquidity. Pricing them independently can overstate output.

  How to read the figure (fixed snapshot, no gas):
  • Left: choose candidate paths, then search over shares.
  • Right: assign token shadow prices, solve each pool's arbitrage independently, then adjust prices to balance net flows.

  Two teaching examples from our guide:
  • Two no-fee constant-product pools, each holding 100 ETH / 300,000 USDC: selling 100 ETH yields 150k USDC via one pool or 200k split equally. Final marginal quotes are ~1,333 USDC/ETH; the average is 2,000.
  • In the 3-pool example, the dual upper bound matches feasible output within float64 rounding: optimal within tolerance.

  Caveat: shadow prices are solver unknowns, not oracle inputs. The paper leaves gas and state changes to future work.
