takeaway: Sampled support covered one narrow rescue; no evidence it extends to a standing freeze power.
tweet: |-
  Was Arbitrum's freeze of the KelpDAO exploiter's ETH censorship? Not a sequencer blacklist: the Security Council patched the L1 Inbox for one tx and sent an L2 transfer in the exploiter's name. Not refusing a tx, but moving funds without the key holder's consent.

  Why it matters: Arbitrum's Bridge checks the Inbox's address, not its code. Rollups whose inbox can be upgraded without delay share this power.

  How to read the figure (Arbitrum One):
  • Left: the patch used for the freeze (9/12 Council, no delay), reused for the Jun 15 release.
  • Right: ArbOS 61 filtering can fail or reroute txs, not impersonate senders. Off on One.

  Two details:
  • Supporters cite a narrow window; critics say the power is not scoped to recovery and affects neutrality.
  • 10 days after the freeze, US creditors served the DAO a restraining order.

  Caveat: the 90.96% Snapshot vote approved releasing funds, not the freeze power. The closest surveyed precedent, Sui, needed validators.
