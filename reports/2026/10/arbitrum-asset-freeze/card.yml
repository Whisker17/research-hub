title: "Arbitrum's freeze: an Inbox upgrade, not a blacklist"
background: Arbitrum executes the messages its Bridge records; the Bridge checks the Inbox's address, not its code.
context: "Apr 21: Arbitrum's Security Council (9/12, no delay) moved the KelpDAO exploiter's 30,765.67 ETH."
